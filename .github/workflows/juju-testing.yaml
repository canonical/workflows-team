name: Juju integration testing

on:
  workflow_call:
    inputs:
      juju-channel:
        description: Juju snap channel passed to concierge.
        required: true
        type: string
      provider:
        description: Concierge preset passed as -p. Not passed when concierge-config is set. A value of k8s also writes kubeconfig and collects pod diagnostics.
        default: k8s
        required: false
        type: string
      concierge-config:
        description: Path to a concierge config file, relative to the repository root. When set, prepare uses -c instead of -p.
        default: ""
        required: false
        type: string
      test-commands:
        description: JSON array of test commands. Each command runs on its own runner.
        default: '["just integration"]'
        required: false
        type: string
      setup-command:
        description: Optional command run after the environment is provisioned.
        default: ""
        required: false
        type: string
      working-directory:
        description: Directory, relative to the repository root, for setup and test commands.
        default: .
        required: false
        type: string
      extra-snaps:
        description: Comma-separated snaps installed by concierge alongside Juju.
        default: astral-uv,just
        required: false
        type: string
      extra-env:
        description: JSON object of environment variables exported for setup and test commands.
        default: "{}"
        required: false
        type: string
      purge-docker:
        description: Remove Docker before bootstrapping. Needed when the runner already has Docker and the provider is k8s.
        default: false
        required: false
        type: boolean
      install-docker:
        description: Install the Docker snap after the provider is bootstrapped.
        default: false
        required: false
        type: boolean
      free-disk-space:
        description: Free disk space on the runner before provisioning.
        default: false
        required: false
        type: boolean
      issue-labels:
        description: Comma-separated labels for the scheduled-failure issue. Each label must already exist. Empty skips labeling.
        default: ""
        required: false
        type: string
      report-manual-runs:
        description: Also open or update failure issues for workflow_dispatch runs. Scheduled runs always report.
        default: false
        required: false
        type: boolean
      runner:
        description: Runner label for the integration jobs.
        default: self-hosted-linux-amd64-noble-medium
        required: false
        type: string
      timeout-minutes:
        description: Timeout for each integration job.
        default: 90
        required: false
        type: number
    secrets:
      ISSUE_LOOKUP_TOKEN:
        description: Token that can read issues in the repositories failure issues get transferred to. Used only to find existing issues. Defaults to the workflow token, which can read public repositories only.
        required: false

permissions:
  contents: read

jobs:
  integration:
    name: Juju integration (${{ matrix.command }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        command: ${{ fromJSON(inputs.test-commands) }}
    steps:
      - name: Maximise runner disk space
        if: ${{ inputs.free-disk-space }}
        uses: jlumbroso/free-disk-space@v1.3.1

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve artifact name
        id: meta
        shell: bash
        env:
          JUJU_CHANNEL: ${{ inputs.juju-channel }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY//\//-}"
          channel="${JUJU_CHANNEL//\//-}"
          echo "artifact-key=${repo}-${channel}" >> "$GITHUB_OUTPUT"

      - name: Prepare integration environment
        shell: bash
        env:
          JUJU_CHANNEL: ${{ inputs.juju-channel }}
          PROVIDER: ${{ inputs.provider }}
          CONCIERGE_CONFIG: ${{ inputs.concierge-config }}
          EXTRA_SNAPS: ${{ inputs.extra-snaps }}
          PURGE_DOCKER: ${{ inputs.purge-docker }}
        run: |
          set -euo pipefail

          if [[ "$PURGE_DOCKER" == "true" ]]; then
            sudo apt-get update
            sudo apt-get purge -y $(dpkg -l | grep -i docker | awk '{print $2}') || true
            sudo apt-get purge -y containerd.io || true
            sudo rm -rf /run/containerd || true
          fi

          sudo snap install concierge --classic

          if [[ -n "$CONCIERGE_CONFIG" ]]; then
            args=(-c "$CONCIERGE_CONFIG" --juju-channel="$JUJU_CHANNEL")
          else
            args=(-p "$PROVIDER" --juju-channel="$JUJU_CHANNEL")
          fi
          if [[ -n "$EXTRA_SNAPS" ]]; then
            args+=(--extra-snaps="$EXTRA_SNAPS")
          fi
          sudo -E concierge prepare "${args[@]}"

          if [[ "$PROVIDER" == "k8s" ]]; then
            mkdir -p ~/.kube
            sudo k8s kubectl config view --raw > ~/.kube/config
          fi

          juju version
          juju controllers
          snap list juju

      - name: Install docker if required
        if: ${{ inputs.install-docker }}
        shell: bash
        run: |
          sudo snap install docker
          sudo snap start docker

      - name: Export extra environment
        shell: bash
        env:
          EXTRA_ENV: ${{ inputs.extra-env }}
        run: |
          set -euo pipefail
          while IFS= read -r key; do
            [[ -n "$key" ]] || continue
            value=$(jq -r --arg key "$key" '.[$key]' <<<"$EXTRA_ENV")
            {
              echo "${key}<<EOF"
              printf '%s\n' "$value"
              echo "EOF"
            } >> "$GITHUB_ENV"
          done < <(jq -r 'keys[]' <<<"$EXTRA_ENV")

      - name: Repository setup
        if: ${{ inputs.setup-command != '' }}
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          SETUP_COMMAND: ${{ inputs.setup-command }}
        run: bash -euo pipefail -c "$SETUP_COMMAND"

      - name: Run integration tests
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          TEST_COMMAND: ${{ matrix.command }}
        run: |
          set -euo pipefail
          printf '%s\n' "$TEST_COMMAND" > "$GITHUB_WORKSPACE/test-command.txt"
          bash -euo pipefail -c "$TEST_COMMAND" 2>&1 | tee "$GITHUB_WORKSPACE/integration.log"

      - name: Collect failure diagnostics
        if: ${{ failure() }}
        shell: bash
        env:
          PROVIDER: ${{ inputs.provider }}
          JUJU_CHANNEL: ${{ inputs.juju-channel }}
        run: |
          mkdir -p diagnostics
          command_text=$(cat "$GITHUB_WORKSPACE/test-command.txt" 2>/dev/null || echo "unknown")
          logfile="$GITHUB_WORKSPACE/integration.log"
          {
            printf 'Command: %s\n\n' "$command_text"
            if [[ -f "$logfile" ]]; then
              echo "Error lines:"
              grep -E -i 'error|traceback|exception|failed|failure|blocked|hook failed' "$logfile" | tail -n 60 || true
              echo
              echo "Log tail:"
              tail -n 80 "$logfile" || true
            else
              echo "integration.log was not written. The job failed before the test command produced output."
            fi
          } > diagnostics/failure-summary.txt

          error_line=""
          if [[ -f "$logfile" ]]; then
            clean_log=$(sed -E 's/\x1b\[[0-9;]*m//g' "$logfile")
            # Pytest's short summary is the failure to track. Do not use the first
            # ^ERROR  line in the full log: juju destroy-model cleanup prints
            # "ERROR model … not found" and would make every failure look the same.
            summary=$(awk '/short test summary info/{p=1} p' <<<"$clean_log")
            if [[ -n "$summary" ]]; then
              error_line=$(grep -E '^(FAILED|ERROR) ' <<<"$summary" | head -n 1 || true)
            fi
            if [[ -z "$error_line" ]]; then
              error_line=$(grep -E '^FAILED ' <<<"$clean_log" | head -n 1 || true)
            fi
            if [[ -z "$error_line" ]]; then
              error_line=$(grep -E '[A-Za-z]+(Error|Exception)\b|^error:|ERROR:' <<<"$clean_log" | tail -n 1 || true)
            fi
          fi
          if [[ -z "$error_line" ]]; then
            error_line="No error line found in the test output"
          fi
          error_line=${error_line:0:300}
          normalized=$(sed -E '
            s/[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}/<uuid>/g
            s/\b[0-9A-Fa-f]{7,}\b/<hex>/g
            s/[0-9]+/N/g
            s/[[:space:]]+/ /g
          ' <<<"$error_line")
          printf '%s\n' "$command_text" > diagnostics/command.txt
          printf '%s\n' "$error_line" > diagnostics/error.txt
          printf '%s\n%s\n%s\n' "$JUJU_CHANNEL" "$command_text" "$normalized" | sha256sum | cut -c1-12 > diagnostics/signature.txt
          juju version > diagnostics/juju-version.txt 2>&1 || true
          juju controllers --format yaml > diagnostics/controllers.yaml 2>&1 || true
          juju models --format yaml > diagnostics/models.yaml 2>&1 || true
          if juju models --format json > diagnostics/models.json 2>&1; then
            {
              echo
              echo "Applications not active:"
            } >> diagnostics/failure-summary.txt
            while IFS= read -r model; do
              juju status -m "$model" --relations >> diagnostics/status.txt 2>&1 || true
              juju status -m "$model" --format json > diagnostics/status.json 2>/dev/null || true
              if [[ -s diagnostics/status.json ]]; then
                jq -r --arg model "$model" '
                  .applications // {} | to_entries[]
                  | (.value["application-status"].current // "") as $status
                  | select($status != "" and $status != "active")
                  | "\($model)/\(.key): \($status) \(.value["application-status"].message // "")"
                ' diagnostics/status.json >> diagnostics/failure-summary.txt || true
              fi
              juju debug-log -m "$model" --replay --no-tail >> diagnostics/juju.log 2>&1 || true
            done < <(jq -r '.models[] | select(."short-name" != "controller") | .name' diagnostics/models.json)
          fi
          if [[ "$PROVIDER" == "k8s" ]]; then
            sudo k8s kubectl get pods -A -o wide > diagnostics/pods.txt 2>&1 || true
            sudo k8s kubectl get events -A --sort-by=.lastTimestamp > diagnostics/events.txt 2>&1 || true
            {
              echo
              echo "Pods not running:"
              awk 'NR == 1 || $4 != "Running"' diagnostics/pods.txt | head -n 40
            } >> diagnostics/failure-summary.txt || true
          fi

      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: juju-testing-diagnostics-${{ steps.meta.outputs.artifact-key }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: |
            integration.log
            diagnostics/
          retention-days: 30

  report-failure:
    needs: integration
    if: ${{ failure() && (github.event_name == 'schedule' || (inputs.report-manual-runs && github.event_name == 'workflow_dispatch')) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    concurrency:
      group: juju-testing-report-${{ github.repository }}-${{ inputs.juju-channel }}
      cancel-in-progress: false
    steps:
      - name: Download failure diagnostics
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: juju-testing-diagnostics-*
          path: failure-artifacts

      - name: Load issue ledger from earlier runs
        id: ledger
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JUJU_CHANNEL: ${{ inputs.juju-channel }}
        run: |
          set -euo pipefail
          name="juju-testing-issues-${JUJU_CHANNEL//\//-}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo '{}' > ledger.json
          if ! id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${name}&per_page=20" \
              --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .id // empty'); then
            echo "::warning::Could not list earlier issue ledgers. Issues are matched against this repository only, and the ledger is not overwritten."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n "$id" ]]; then
            if ! { gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > ledger.zip \
                && unzip -o -q ledger.zip ledger.json \
                && jq -e 'type == "object"' ledger.json > /dev/null; }; then
              echo "::warning::Could not read issue ledger artifact ${id}. Issues are matched against this repository only, and the ledger is not overwritten."
              echo '{}' > ledger.json
              echo "ok=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "Loaded $(jq 'length' ledger.json) ledger entries from artifact ${id:-none}"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Open or update failure issues
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LOOKUP_TOKEN: ${{ secrets.ISSUE_LOOKUP_TOKEN || github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ISSUE_LABELS: ${{ inputs.issue-labels }}
          JUJU_CHANNEL: ${{ inputs.juju-channel }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref_name }}
          UPSTREAM_REPO: juju/juju
        run: |
          set -euo pipefail
          shopt -s nullglob
          groups=$(mktemp -d)

          for summary in failure-artifacts/*/diagnostics/failure-summary.txt; do
            dir=$(dirname "$summary")
            sig=$(cat "$dir/signature.txt" 2>/dev/null || echo unknown)
            group="$groups/$sig"
            mkdir -p "$group"
            command_text=$(cat "$dir/command.txt" 2>/dev/null || echo unknown)
            [[ -f "$group/error.txt" ]] || cp "$dir/error.txt" "$group/error.txt" 2>/dev/null || true
            printf '%s\n' "$command_text" >> "$group/commands.txt"
            if [[ ! -f "$group/excerpt.md" || $(wc -c < "$group/excerpt.md") -lt 40000 ]]; then
              {
                printf '\n### %s\n\n~~~~text\n' "$command_text"
                head -c 12000 "$summary"
                printf '\n~~~~\n'
              } >> "$group/excerpt.md"
            fi
          done

          group_dirs=("$groups"/*/)
          if (( ${#group_dirs[@]} == 0 )); then
            sig=$(printf '%s\nno-diagnostics\n' "$JUJU_CHANNEL" | sha256sum | cut -c1-12)
            mkdir -p "$groups/$sig"
            echo "No diagnostics were uploaded" > "$groups/$sig/error.txt"
            echo "unknown" > "$groups/$sig/commands.txt"
            echo "The integration job failed or timed out before diagnostics were collected. Check the failed jobs in the run." > "$groups/$sig/excerpt.md"
            group_dirs=("$groups/$sig/")
          fi

          note() {
            printf '%s\n' "$1"
            printf -- '- %s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
          }
          record() {
            jq --arg sig "$1" --arg url "$2" --arg repo "$3" --argjson number "$4" \
              '.[$sig] = {url: $url, repo: $repo, number: $number}' ledger.json > ledger.tmp
            mv ledger.tmp ledger.json
          }

          open_issues=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --limit 1000 --json number,body,url)
          closed_here=$(gh issue list -R "$GITHUB_REPOSITORY" --state closed --limit 200 --json number,body,url)

          skip_closed() {
            note "Signature $1 already reported in closed $2. No issue opened."
            record "$1" "$2" "$3" "$4"
          }

          UPSTREAM_REPO=${UPSTREAM_REPO:-juju/juju}

          # Current tracker is only an "Upstream:" line in a comment, not the issue body.
          upstream_from_comments() {
            grep -Ei '^[[:space:]]*Upstream:[[:space:]]*https://github.com/[^[:space:]]+/issues/[0-9]+' <<<"$1" \
              | grep -Eo 'https://github.com/[^[:space:]]+/issues/[0-9]+' | head -n 1 || true
          }

          local_comments() {
            GH_TOKEN="$LOOKUP_TOKEN" gh api --paginate "repos/${1}/issues/${2}/comments" --jq '.[].body' 2>/dev/null || true
          }

          comment_on_local() {
            local number=$1
            local body=$2
            if [[ "$3" == "$GITHUB_REPOSITORY" ]]; then
              gh issue comment "$number" -R "$GITHUB_REPOSITORY" --body "$body"
            fi
          }

          create_local_issue() {
            local previous=$1 closed_up=$2
            local first_command cmd_file pytest_re test_id test_path subject short prefix suffix middle room title create_args label url labels
            first_command=$(head -n 1 <<<"$commands")
            cmd_file=$(grep -Eo 'tests/[^[:space:]]+\.py' <<<"$first_command" | head -n 1 || true)
            pytest_re='^(FAILED|ERROR) ([^ ]+)( - (.*))?$'
            if [[ "$error_line" =~ $pytest_re ]]; then
              test_id=${BASH_REMATCH[2]}
              test_path=${test_id%%::*}
              subject="${test_path##*/}${test_id#"$test_path"}"
              short=${BASH_REMATCH[4]:-${BASH_REMATCH[1],,}}
            elif [[ -n "$cmd_file" ]]; then
              subject=${cmd_file##*/}
              short=$error_line
            else
              subject=$first_command
              short=$error_line
            fi
            if (( ${#short} > 100 )); then
              short="${short:0:97}..."
            fi
            prefix="Juju integration tests failed on ${GITHUB_REPOSITORY#*/} (Juju ${JUJU_CHANNEL}): "
            suffix=" [${sig}]"
            middle="${subject} - ${short}"
            room=$(( 250 - ${#prefix} - ${#suffix} ))
            if (( ${#middle} > room )); then
              middle="${middle:0:room-3}..."
            fi
            title="${prefix}${middle}${suffix}"
            {
              printf '%s\n\n' "$marker"
              if [[ -n "$previous" || -n "$closed_up" ]]; then
                printf 'Needs triaging: report a new upstream bug on %s.\n\n' "$UPSTREAM_REPO"
                [[ -n "$previous" ]] && printf 'Previous local issue: %s\n' "$previous"
                [[ -n "$closed_up" ]] && printf 'Closed upstream: %s\n' "$closed_up"
                printf '\n'
              fi
              printf 'Failure signature: %s\n\n' "$sig"
              printf 'Run: %s\nRef: %s\nCommit: %s\nJuju channel: %s\n\n' "$RUN_URL" "$SOURCE_REF" "$SOURCE_SHA" "$JUJU_CHANNEL"
              printf 'Error:\n\n~~~~text\n%s\n~~~~\n\n' "$error_line"
              printf 'Failed commands:\n%s\n\n' "$command_list"
              printf '## Failure summary\n'
              cat "$group/excerpt.md"
              printf '\nClone this failure to %s and comment the link here as:\n\nUpstream: https://github.com/%s/issues/N\n\nLater failing runs comment here while that upstream issue is open. If it is closed and tests still fail, this issue is closed and a new local issue is opened for Jira triage. A scheduled passing run closes this issue when there is no upstream link, or when the linked upstream issue is closed.\n' "$UPSTREAM_REPO" "$UPSTREAM_REPO"
            } > "$group/body.md"
            create_args=(-R "$GITHUB_REPOSITORY" --title "$title" --body-file "$group/body.md")
            IFS=',' read -ra labels <<<"$ISSUE_LABELS"
            for label in "${labels[@]}"; do
              label=$(xargs <<<"$label")
              if [[ -n "$label" ]]; then
                create_args+=(--label "$label")
              fi
            done
            gh issue create "${create_args[@]}" | tail -n 1
          }

          # Returns 0 when this issue fully handled the failure (caller should continue).
          follow_upstream() {
            local number=$1 state=$2 url=$3 repo=$4
            local up up_json up_state up_url owner name issue_n comments new_url
            comments=$(local_comments "$repo" "$number")
            up=$(upstream_from_comments "$comments")
            [[ -n "$up" ]] || return 1
            if [[ ! "$up" =~ https://github.com/([^/]+)/([^/]+)/issues/([0-9]+) ]]; then
              return 1
            fi
            owner=${BASH_REMATCH[1]}
            name=${BASH_REMATCH[2]}
            issue_n=${BASH_REMATCH[3]}
            if ! up_json=$(GH_TOKEN="$LOOKUP_TOKEN" gh api "repos/${owner}/${name}/issues/${issue_n}" 2> up.err); then
              note "Could not read upstream ${up}. Treating it as still open. No new issue."
              comment_on_local "$number" "$(printf '%s\n\nUpstream (unread): %s\n' "$recurrence" "$up")" "$repo"
              record "$sig" "$url" "$repo" "$number"
              return 0
            fi
            up_state=$(jq -r '.state' <<<"$up_json")
            up_url=$(jq -r '.html_url' <<<"$up_json")
            if [[ "$up_state" == "open" ]]; then
              comment_on_local "$number" "$(printf 'Already reported on %s (still open): %s\n\n%s\n' "$UPSTREAM_REPO" "$up_url" "$recurrence")" "$repo"
              record "$sig" "$url" "$repo" "$number"
              note "Upstream ${up_url} is open. Commented on ${url}. No issue opened."
              return 0
            fi
            # Upstream closed, tests still fail: close this local issue (if open) and open
            # a successor so Jira sees a new triage item. Humans file a new upstream bug
            # and comment Upstream: on the successor.
            if [[ "$repo" == "$GITHUB_REPOSITORY" ]]; then
              new_url=$(create_local_issue "$url" "$up_url")
              if [[ "$state" == "open" ]]; then
                gh issue close "$number" -R "$GITHUB_REPOSITORY" --comment "$(printf 'Upstream %s is closed but tests still fail. Opened %s for triage and a new upstream report.\n' "$up_url" "$new_url")"
                note "Upstream ${up_url} is closed. Tests still fail. Closed ${url}. Opened ${new_url} for Jira triage."
              else
                note "Upstream ${up_url} is closed. Tests still fail. Opened ${new_url} for Jira triage. Previous ${url} was already closed."
              fi
              record "$sig" "$new_url" "$GITHUB_REPOSITORY" "${new_url##*/}"
              return 0
            fi
            note "Upstream ${up_url} is closed. Current run still fails. Tracked issue was transferred to ${url}."
            return 1
          }

          issue_with_marker() {
            jq -c --arg marker "$marker" \
              'map(select((.body // "") | contains($marker))) | sort_by(.number) | last // empty' <<<"$1"
          }

          scan_issues_for_upstream() {
            local list=$1 issue number comments
            while IFS= read -r issue; do
              [[ -n "$issue" ]] || continue
              number=$(jq -r '.number' <<<"$issue")
              comments=$(local_comments "$GITHUB_REPOSITORY" "$number")
              if [[ -n "$(upstream_from_comments "$comments")" ]]; then
                printf '%s' "$issue"
                return
              fi
            done < <(jq -c '.[0:30][]' <<<"$list")
          }

          for group in "${group_dirs[@]}"; do
            group=${group%/}
            sig=$(basename "$group")
            marker="<!-- juju-testing-signature:${sig} -->"
            error_line=$(cat "$group/error.txt" 2>/dev/null || echo "unknown error")
            commands=$(sort -u "$group/commands.txt")
            command_list=$(sed 's/^/- /' <<<"$commands")
            note "Matching signature ${sig}; command: ${commands//$'\n'/ | }; error: ${error_line}"
            recurrence=$(printf 'Failed again with the same error.\n\nRun: %s\nCommit: %s\nFailed commands:\n%s\n' \
              "$RUN_URL" "$SOURCE_SHA" "$command_list")

            target=""
            target_state=""
            target_url=""
            target_repo=""
            target_body=""
            entry=$(jq -c --arg sig "$sig" '.[$sig] // empty' ledger.json)
            if [[ -n "$entry" ]]; then
              recorded_repo=$(jq -r '.repo' <<<"$entry")
              recorded_number=$(jq -r '.number' <<<"$entry")
              if issue=$(GH_TOKEN="$LOOKUP_TOKEN" gh api "repos/${recorded_repo}/issues/${recorded_number}" 2> lookup.err); then
                target=$(jq -r '.number' <<<"$issue")
                target_state=$(jq -r '.state' <<<"$issue")
                target_url=$(jq -r '.html_url' <<<"$issue")
                target_repo=$(jq -r '.repository_url | sub("^.*/repos/"; "")' <<<"$issue")
                target_body=$(jq -r '.body // ""' <<<"$issue")
              elif grep -q 'HTTP 410' lookup.err; then
                note "Signature ${sig} was tracked in ${recorded_repo}#${recorded_number}, which was deleted. Opening a new issue."
              elif grep -q 'HTTP 404' lookup.err; then
                note "Signature ${sig} was tracked in ${recorded_repo}#${recorded_number}, which this repository can no longer read. It was likely transferred to a private repository. No issue opened."
                continue
              else
                cat lookup.err >&2
                exit 1
              fi
            fi

            if [[ -z "$target" ]]; then
              found_issue=$(issue_with_marker "$open_issues")
              found_state=open
              found_repo=$GITHUB_REPOSITORY
              if [[ -z "$found_issue" ]]; then
                found_issue=$(issue_with_marker "$closed_here")
                found_state=closed
              fi
              if [[ -z "$found_issue" ]]; then
                if ! found=$(GH_TOKEN="$LOOKUP_TOKEN" gh search issues "$sig" --owner "$GITHUB_REPOSITORY_OWNER" \
                    --limit 30 --json number,state,url,repository,body,updatedAt 2> search.err); then
                  echo "::warning::Searching ${GITHUB_REPOSITORY_OWNER} for signature ${sig} failed: $(cat search.err)"
                  found='[]'
                fi
                found_issue=$(jq -c --arg marker "$marker" \
                  'map(select((.body // "") | contains($marker))) | sort_by(.updatedAt) | last // empty' <<<"$found")
                if [[ -n "$found_issue" ]]; then
                  found_state=$(jq -r '.state | ascii_downcase' <<<"$found_issue")
                  found_repo=$(jq -r '.repository.nameWithOwner' <<<"$found_issue")
                fi
              fi
              if [[ -z "$found_issue" ]]; then
                found_issue=$(scan_issues_for_upstream "$open_issues")
                found_state=open
                found_repo=$GITHUB_REPOSITORY
              fi
              if [[ -z "$found_issue" ]]; then
                found_issue=$(scan_issues_for_upstream "$closed_here")
                found_state=closed
                found_repo=$GITHUB_REPOSITORY
              fi
              if [[ -z "$found_issue" ]]; then
                if ! found=$(GH_TOKEN="$LOOKUP_TOKEN" gh search issues "Upstream:" --repo "$GITHUB_REPOSITORY" \
                    --limit 20 --json number,state,url,repository,body,updatedAt 2> search.err); then
                  echo "::warning::Searching ${GITHUB_REPOSITORY} for Upstream: links failed: $(cat search.err)"
                  found='[]'
                fi
                found_issue=$(scan_issues_for_upstream "$found")
                if [[ -n "$found_issue" ]]; then
                  found_state=$(jq -r '.state | ascii_downcase' <<<"$found_issue")
                  found_repo=$(jq -r --arg repo "$GITHUB_REPOSITORY" '.repository.nameWithOwner // $repo' <<<"$found_issue")
                fi
              fi
              if [[ -n "$found_issue" ]]; then
                target=$(jq -r '.number' <<<"$found_issue")
                target_state=$found_state
                target_url=$(jq -r '.url // .html_url' <<<"$found_issue")
                target_repo=$found_repo
                target_body=$(jq -r '.body // ""' <<<"$found_issue")
              fi
            fi

            if [[ -n "$target" ]]; then
              if follow_upstream "$target" "$target_state" "$target_url" "$target_repo"; then
                continue
              fi
              if [[ "$target_repo" == "$GITHUB_REPOSITORY" && "$target_state" == "open" ]]; then
                gh issue comment "$target" -R "$GITHUB_REPOSITORY" --body "$recurrence"
                record "$sig" "$target_url" "$GITHUB_REPOSITORY" "$target"
                note "Signature ${sig} recurred. Commented on ${target_url}."
                continue
              fi
              if [[ "$target_state" == "open" ]]; then
                note "Signature ${sig} is already tracked in ${target_url}. No issue opened."
                record "$sig" "$target_url" "$target_repo" "$target"
                continue
              fi
              skip_closed "$sig" "$target_url" "$target_repo" "$target"
              continue
            fi

            url=$(create_local_issue "" "")
            record "$sig" "$url" "$GITHUB_REPOSITORY" "${url##*/}"
            note "Signature ${sig} is new. Opened ${url}."
          done

      - name: Save issue ledger
        if: ${{ always() && steps.ledger.outputs.ok == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ledger.outputs.name }}
          path: ledger.json
          retention-days: 90

  close-if-fixed:
    needs: integration
    if: ${{ success() && (github.event_name == 'schedule' || (inputs.report-manual-runs && github.event_name == 'workflow_dispatch')) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    concurrency:
      group: juju-testing-report-${{ github.repository }}-${{ inputs.juju-channel }}
      cancel-in-progress: false
    steps:
      - name: Load issue ledger from earlier runs
        id: ledger
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JUJU_CHANNEL: ${{ inputs.juju-channel }}
        run: |
          set -euo pipefail
          name="juju-testing-issues-${JUJU_CHANNEL//\//-}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo '{}' > ledger.json
          if ! id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${name}&per_page=20" \
              --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .id // empty'); then
            echo "::warning::Could not list earlier issue ledgers. Open local issues are left unchanged."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n "$id" ]]; then
            if ! { gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > ledger.zip \
                && unzip -o -q ledger.zip ledger.json \
                && jq -e 'type == "object"' ledger.json > /dev/null; }; then
              echo "::warning::Could not read issue ledger artifact ${id}. Open local issues are left unchanged."
              echo '{}' > ledger.json
              echo "ok=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "Loaded $(jq 'length' ledger.json) ledger entries from artifact ${id:-none}"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Close local issues when tests pass and upstream is closed
        if: ${{ steps.ledger.outputs.ok == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LOOKUP_TOKEN: ${{ secrets.ISSUE_LOOKUP_TOKEN || github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          UPSTREAM_REPO: juju/juju
        run: |
          set -euo pipefail
          UPSTREAM_REPO=${UPSTREAM_REPO:-juju/juju}

          note() {
            printf '%s\n' "$1"
            printf -- '- %s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
          }

          upstream_from_comments() {
            grep -Ei '^[[:space:]]*Upstream:[[:space:]]*https://github.com/[^[:space:]]+/issues/[0-9]+' <<<"$1" \
              | grep -Eo 'https://github.com/[^[:space:]]+/issues/[0-9]+' | head -n 1 || true
          }

          local_comments() {
            GH_TOKEN="$LOOKUP_TOKEN" gh api --paginate "repos/${1}/issues/${2}/comments" --jq '.[].body' 2>/dev/null || true
          }

          while IFS= read -r entry; do
            [[ -n "$entry" ]] || continue
            repo=$(jq -r '.value.repo' <<<"$entry")
            number=$(jq -r '.value.number' <<<"$entry")
            url=$(jq -r '.value.url' <<<"$entry")
            [[ "$repo" == "$GITHUB_REPOSITORY" ]] || continue
            if ! issue=$(GH_TOKEN="$LOOKUP_TOKEN" gh api "repos/${repo}/issues/${number}" 2>/dev/null); then
              note "Could not read ${repo}#${number}. Left it unchanged."
              continue
            fi
            state=$(jq -r '.state' <<<"$issue")
            if [[ "$state" != "open" ]]; then
              note "${url} is already closed."
              continue
            fi
            comments=$(local_comments "$repo" "$number")
            up=$(upstream_from_comments "$comments")
            if [[ -z "$up" ]]; then
              gh issue close "$number" -R "$repo" --comment "$(printf 'Tests passed in %s. No linked %s issue; treating this as a local-only failure that is resolved.\n' "$RUN_URL" "$UPSTREAM_REPO")"
              note "Tests passed. ${url} has no ${UPSTREAM_REPO} link. Closed it."
              continue
            fi
            if [[ ! "$up" =~ https://github.com/([^/]+)/([^/]+)/issues/([0-9]+) ]]; then
              continue
            fi
            if ! up_json=$(GH_TOKEN="$LOOKUP_TOKEN" gh api "repos/${BASH_REMATCH[1]}/${BASH_REMATCH[2]}/issues/${BASH_REMATCH[3]}" 2>/dev/null); then
              note "Could not read upstream ${up}. Left ${url} open."
              continue
            fi
            up_state=$(jq -r '.state' <<<"$up_json")
            up_url=$(jq -r '.html_url' <<<"$up_json")
            if [[ "$up_state" != "closed" ]]; then
              note "Tests passed. Upstream ${up_url} is still open. Left ${url} open."
              continue
            fi
            gh issue close "$number" -R "$repo" --comment "$(printf 'Tests passed in %s after upstream was closed.\n\nUpstream: %s\n' "$RUN_URL" "$up_url")"
            note "Tests passed and upstream ${up_url} is closed. Closed ${url}."
          done < <(jq -c 'to_entries[]' ledger.json)
