name: Juju integration testing

on:
  workflow_call:
    inputs:
      juju-channel:
        description: Juju snap channel passed to concierge.
        required: true
        type: string
      provider:
        description: Concierge preset passed as -p. Not passed when concierge-config is set. A value of k8s also writes kubeconfig and collects pod diagnostics.
        default: k8s
        required: false
        type: string
      concierge-config:
        description: Path to a concierge config file, relative to the repository root. When set, prepare uses -c instead of -p.
        default: ""
        required: false
        type: string
      test-commands:
        description: JSON array of test commands. Each command runs on its own runner.
        default: '["just integration"]'
        required: false
        type: string
      setup-command:
        description: Optional command run after the environment is provisioned.
        default: ""
        required: false
        type: string
      working-directory:
        description: Directory, relative to the repository root, for setup and test commands.
        default: .
        required: false
        type: string
      extra-snaps:
        description: Comma-separated snaps installed by concierge alongside Juju.
        default: astral-uv,just
        required: false
        type: string
      extra-env:
        description: JSON object of environment variables exported for setup and test commands.
        default: "{}"
        required: false
        type: string
      purge-docker:
        description: Remove Docker before bootstrapping. Needed when the runner already has Docker and the provider is k8s.
        default: false
        required: false
        type: boolean
      install-docker:
        description: Install the Docker snap after the provider is bootstrapped.
        default: false
        required: false
        type: boolean
      free-disk-space:
        description: Free disk space on the runner before provisioning.
        default: false
        required: false
        type: boolean
      issue-labels:
        description: Comma-separated labels for the scheduled-failure issue. Each label must already exist. Empty skips labeling.
        default: ""
        required: false
        type: string
      report-manual-runs:
        description: Also open or update failure issues for workflow_dispatch runs. Scheduled runs always report.
        default: false
        required: false
        type: boolean
      runner:
        description: Runner label for the integration jobs.
        default: self-hosted-linux-amd64-noble-medium
        required: false
        type: string
      timeout-minutes:
        description: Timeout for each integration job.
        default: 90
        required: false
        type: number
    secrets:
      ISSUE_LOOKUP_TOKEN:
        description: Token that can read issues in the repositories failure issues get transferred to. Used only to find existing issues. Defaults to the workflow token, which can read public repositories only.
        required: false

permissions:
  contents: read

jobs:
  integration:
    name: Juju integration (${{ matrix.command }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        command: ${{ fromJSON(inputs.test-commands) }}
    steps:
      - name: Maximise runner disk space
        if: ${{ inputs.free-disk-space }}
        uses: jlumbroso/free-disk-space@v1.3.1

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve artifact name
        id: meta
        shell: bash
        env:
          JUJU_CHANNEL: ${{ inputs.juju-channel }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY//\//-}"
          channel="${JUJU_CHANNEL//\//-}"
          echo "artifact-key=${repo}-${channel}" >> "$GITHUB_OUTPUT"

      - name: Prepare integration environment
        shell: bash
        env:
          JUJU_CHANNEL: ${{ inputs.juju-channel }}
          PROVIDER: ${{ inputs.provider }}
          CONCIERGE_CONFIG: ${{ inputs.concierge-config }}
          EXTRA_SNAPS: ${{ inputs.extra-snaps }}
          PURGE_DOCKER: ${{ inputs.purge-docker }}
        run: |
          set -euo pipefail

          if [[ "$PURGE_DOCKER" == "true" ]]; then
            sudo apt-get update
            sudo apt-get purge -y $(dpkg -l | grep -i docker | awk '{print $2}') || true
            sudo apt-get purge -y containerd.io || true
            sudo rm -rf /run/containerd || true
          fi

          sudo snap install concierge --classic

          if [[ -n "$CONCIERGE_CONFIG" ]]; then
            args=(-c "$CONCIERGE_CONFIG" --juju-channel="$JUJU_CHANNEL")
          else
            args=(-p "$PROVIDER" --juju-channel="$JUJU_CHANNEL")
          fi
          if [[ -n "$EXTRA_SNAPS" ]]; then
            args+=(--extra-snaps="$EXTRA_SNAPS")
          fi
          sudo -E concierge prepare "${args[@]}"

          if [[ "$PROVIDER" == "k8s" ]]; then
            mkdir -p ~/.kube
            sudo k8s kubectl config view --raw > ~/.kube/config
          fi

          juju version
          juju controllers
          snap list juju

      - name: Install docker if required
        if: ${{ inputs.install-docker }}
        shell: bash
        run: |
          sudo snap install docker
          sudo snap start docker

      - name: Export extra environment
        shell: bash
        env:
          EXTRA_ENV: ${{ inputs.extra-env }}
        run: |
          set -euo pipefail
          while IFS= read -r key; do
            [[ -n "$key" ]] || continue
            value=$(jq -r --arg key "$key" '.[$key]' <<<"$EXTRA_ENV")
            {
              echo "${key}<<EOF"
              printf '%s\n' "$value"
              echo "EOF"
            } >> "$GITHUB_ENV"
          done < <(jq -r 'keys[]' <<<"$EXTRA_ENV")

      - name: Repository setup
        if: ${{ inputs.setup-command != '' }}
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          SETUP_COMMAND: ${{ inputs.setup-command }}
        run: bash -euo pipefail -c "$SETUP_COMMAND"

      - name: Run integration tests
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          TEST_COMMAND: ${{ matrix.command }}
        run: |
          set -euo pipefail
          printf '%s\n' "$TEST_COMMAND" > "$GITHUB_WORKSPACE/test-command.txt"
          bash -euo pipefail -c "$TEST_COMMAND" 2>&1 | tee "$GITHUB_WORKSPACE/integration.log"

      - name: Collect failure diagnostics
        if: ${{ failure() }}
        shell: bash
        env:
          PROVIDER: ${{ inputs.provider }}
          JUJU_CHANNEL: ${{ inputs.juju-channel }}
        run: |
          mkdir -p diagnostics
          command_text=$(cat "$GITHUB_WORKSPACE/test-command.txt" 2>/dev/null || echo "unknown")
          logfile="$GITHUB_WORKSPACE/integration.log"
          {
            printf 'Command: %s\n\n' "$command_text"
            if [[ -f "$logfile" ]]; then
              echo "Error lines:"
              grep -E -i 'error|traceback|exception|failed|failure|blocked|hook failed' "$logfile" | tail -n 60 || true
              echo
              echo "Log tail:"
              tail -n 80 "$logfile" || true
            else
              echo "integration.log was not written. The job failed before the test command produced output."
            fi
          } > diagnostics/failure-summary.txt

          error_line=""
          if [[ -f "$logfile" ]]; then
            clean_log=$(sed -E 's/\x1b\[[0-9;]*m//g' "$logfile")
            error_line=$(grep -E '^(FAILED|ERROR) ' <<<"$clean_log" | head -n 1 || true)
            if [[ -z "$error_line" ]]; then
              error_line=$(grep -E '[A-Za-z]+(Error|Exception)\b|^error:|ERROR:' <<<"$clean_log" | tail -n 1 || true)
            fi
          fi
          if [[ -z "$error_line" ]]; then
            error_line="No error line found in the test output"
          fi
          error_line=${error_line:0:300}
          normalized=$(sed -E '
            s/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/<uuid>/g
            s/\b[0-9a-f]{7,}\b/<hex>/g
            s/[0-9]+/N/g
            s/[[:space:]]+/ /g
          ' <<<"$error_line")
          printf '%s\n' "$command_text" > diagnostics/command.txt
          printf '%s\n' "$error_line" > diagnostics/error.txt
          printf '%s\n%s\n%s\n' "$JUJU_CHANNEL" "$command_text" "$normalized" | sha256sum | cut -c1-12 > diagnostics/signature.txt
          juju version > diagnostics/juju-version.txt 2>&1 || true
          juju controllers --format yaml > diagnostics/controllers.yaml 2>&1 || true
          juju models --format yaml > diagnostics/models.yaml 2>&1 || true
          if juju models --format json > diagnostics/models.json 2>&1; then
            {
              echo
              echo "Applications not active:"
            } >> diagnostics/failure-summary.txt
            while IFS= read -r model; do
              juju status -m "$model" --relations >> diagnostics/status.txt 2>&1 || true
              juju status -m "$model" --format json > diagnostics/status.json 2>/dev/null || true
              if [[ -s diagnostics/status.json ]]; then
                jq -r --arg model "$model" '
                  .applications // {} | to_entries[]
                  | (.value["application-status"].current // "") as $status
                  | select($status != "" and $status != "active")
                  | "\($model)/\(.key): \($status) \(.value["application-status"].message // "")"
                ' diagnostics/status.json >> diagnostics/failure-summary.txt || true
              fi
              juju debug-log -m "$model" --replay --no-tail >> diagnostics/juju.log 2>&1 || true
            done < <(jq -r '.models[] | select(."short-name" != "controller") | .name' diagnostics/models.json)
          fi
          if [[ "$PROVIDER" == "k8s" ]]; then
            sudo k8s kubectl get pods -A -o wide > diagnostics/pods.txt 2>&1 || true
            sudo k8s kubectl get events -A --sort-by=.lastTimestamp > diagnostics/events.txt 2>&1 || true
            {
              echo
              echo "Pods not running:"
              awk 'NR == 1 || $4 != "Running"' diagnostics/pods.txt | head -n 40
            } >> diagnostics/failure-summary.txt || true
          fi

      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: juju-testing-diagnostics-${{ steps.meta.outputs.artifact-key }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: |
            integration.log
            diagnostics/
          retention-days: 14

  report-failure:
    needs: integration
    if: ${{ failure() && (github.event_name == 'schedule' || (inputs.report-manual-runs && github.event_name == 'workflow_dispatch')) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    concurrency:
      group: juju-testing-report-${{ github.repository }}-${{ inputs.juju-channel }}
      cancel-in-progress: false
    steps:
      - name: Download failure diagnostics
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: juju-testing-diagnostics-*
          path: failure-artifacts

      - name: Load issue ledger from earlier runs
        id: ledger
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JUJU_CHANNEL: ${{ inputs.juju-channel }}
        run: |
          set -euo pipefail
          name="juju-testing-issues-${JUJU_CHANNEL//\//-}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo '{}' > ledger.json
          if ! id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${name}&per_page=20" \
              --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .id // empty'); then
            echo "::warning::Could not list earlier issue ledgers. Issues are matched against this repository only, and the ledger is not overwritten."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n "$id" ]]; then
            if ! { gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > ledger.zip \
                && unzip -o -q ledger.zip ledger.json \
                && jq -e 'type == "object"' ledger.json > /dev/null; }; then
              echo "::warning::Could not read issue ledger artifact ${id}. Issues are matched against this repository only, and the ledger is not overwritten."
              echo '{}' > ledger.json
              echo "ok=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "Loaded $(jq 'length' ledger.json) ledger entries from artifact ${id:-none}"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Open or update failure issues
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LOOKUP_TOKEN: ${{ secrets.ISSUE_LOOKUP_TOKEN || github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ISSUE_LABELS: ${{ inputs.issue-labels }}
          JUJU_CHANNEL: ${{ inputs.juju-channel }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          groups=$(mktemp -d)

          for summary in failure-artifacts/*/diagnostics/failure-summary.txt; do
            dir=$(dirname "$summary")
            sig=$(cat "$dir/signature.txt" 2>/dev/null || echo unknown)
            group="$groups/$sig"
            mkdir -p "$group"
            command_text=$(cat "$dir/command.txt" 2>/dev/null || echo unknown)
            [[ -f "$group/error.txt" ]] || cp "$dir/error.txt" "$group/error.txt" 2>/dev/null || true
            printf '%s\n' "$command_text" >> "$group/commands.txt"
            if [[ ! -f "$group/excerpt.md" || $(wc -c < "$group/excerpt.md") -lt 40000 ]]; then
              {
                printf '\n### %s\n\n~~~~text\n' "$command_text"
                head -c 12000 "$summary"
                printf '\n~~~~\n'
              } >> "$group/excerpt.md"
            fi
          done

          group_dirs=("$groups"/*/)
          if (( ${#group_dirs[@]} == 0 )); then
            sig=$(printf '%s\nno-diagnostics\n' "$JUJU_CHANNEL" | sha256sum | cut -c1-12)
            mkdir -p "$groups/$sig"
            echo "No diagnostics were uploaded" > "$groups/$sig/error.txt"
            echo "unknown" > "$groups/$sig/commands.txt"
            echo "The integration job failed or timed out before diagnostics were collected. Check the failed jobs in the run." > "$groups/$sig/excerpt.md"
            group_dirs=("$groups/$sig/")
          fi

          note() {
            printf '%s\n' "$1"
            printf -- '- %s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
          }
          record() {
            jq --arg sig "$1" --arg url "$2" --arg repo "$3" --argjson number "$4" \
              '.[$sig] = {url: $url, repo: $repo, number: $number}' ledger.json > ledger.tmp
            mv ledger.tmp ledger.json
          }

          open_issues=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --limit 1000 --json number,body)
          closed_here=$(gh issue list -R "$GITHUB_REPOSITORY" --state closed --limit 200 --json number,body,url)

          skip_closed() {
            note "Signature $1 already reported in closed $2. No issue opened."
            record "$1" "$2" "$3" "$4"
          }

          for group in "${group_dirs[@]}"; do
            group=${group%/}
            sig=$(basename "$group")
            marker="<!-- juju-testing-signature:${sig} -->"
            error_line=$(cat "$group/error.txt" 2>/dev/null || echo "unknown error")
            commands=$(sort -u "$group/commands.txt")
            command_list=$(sed 's/^/- /' <<<"$commands")
            note "Matching signature ${sig}; command: ${commands//$'\n'/ | }; error: ${error_line}"
            recurrence=$(printf 'Failed again with the same error.\n\nRun: %s\nCommit: %s\nFailed commands:\n%s\n' \
              "$RUN_URL" "$SOURCE_SHA" "$command_list")

            target=""
            entry=$(jq -c --arg sig "$sig" '.[$sig] // empty' ledger.json)
            if [[ -n "$entry" ]]; then
              recorded_repo=$(jq -r '.repo' <<<"$entry")
              recorded_number=$(jq -r '.number' <<<"$entry")
              if issue=$(GH_TOKEN="$LOOKUP_TOKEN" gh api "repos/${recorded_repo}/issues/${recorded_number}" 2> lookup.err); then
                state=$(jq -r '.state' <<<"$issue")
                url=$(jq -r '.html_url' <<<"$issue")
                number=$(jq -r '.number' <<<"$issue")
                current_repo=$(jq -r '.repository_url | sub("^.*/repos/"; "")' <<<"$issue")
                if [[ "$current_repo" == "$GITHUB_REPOSITORY" && "$state" == "open" ]]; then
                  target=$number
                elif [[ "$state" == "open" ]]; then
                  note "Signature ${sig} is already tracked in ${url}. No issue opened."
                  record "$sig" "$url" "$current_repo" "$number"
                  continue
                else
                  skip_closed "$sig" "$url" "$current_repo" "$number"
                  continue
                fi
              elif grep -q 'HTTP 410' lookup.err; then
                note "Signature ${sig} was tracked in ${recorded_repo}#${recorded_number}, which was deleted. Opening a new issue."
              elif grep -q 'HTTP 404' lookup.err; then
                note "Signature ${sig} was tracked in ${recorded_repo}#${recorded_number}, which this repository can no longer read. It was likely transferred to a private repository. No issue opened."
                continue
              else
                cat lookup.err >&2
                exit 1
              fi
            fi

            if [[ -z "$target" ]]; then
              target=$(jq -r --arg marker "$marker" \
                'map(select((.body // "") | contains($marker))) | sort_by(.number) | .[0].number // empty' <<<"$open_issues")
              if [[ -z "$target" ]]; then
                closed_match=$(jq -c --arg marker "$marker" \
                  'map(select((.body // "") | contains($marker))) | sort_by(.number) | last // empty' <<<"$closed_here")
                if [[ -n "$closed_match" ]]; then
                  skip_closed "$sig" "$(jq -r '.url' <<<"$closed_match")" "$GITHUB_REPOSITORY" "$(jq -r '.number' <<<"$closed_match")"
                  continue
                fi
                if ! found=$(GH_TOKEN="$LOOKUP_TOKEN" gh search issues "$sig" --owner "$GITHUB_REPOSITORY_OWNER" \
                    --limit 30 --json number,state,url,repository,body,updatedAt 2> search.err); then
                  echo "::warning::Searching ${GITHUB_REPOSITORY_OWNER} for signature ${sig} failed: $(cat search.err)"
                  found='[]'
                fi
                open_match=$(jq -c --arg marker "$marker" --arg repo "$GITHUB_REPOSITORY" '
                  map(select(((.body // "") | contains($marker)) and (.state | ascii_downcase) == "open"))
                  | sort_by(.repository.nameWithOwner != $repo) | .[0] // empty' <<<"$found")
                transferred_closed=$(jq -c --arg marker "$marker" --arg repo "$GITHUB_REPOSITORY" '
                  map(select(((.body // "") | contains($marker)) and (.state | ascii_downcase) != "open" and .repository.nameWithOwner != $repo))
                  | sort_by(.updatedAt) | last // empty' <<<"$found")
                if [[ -n "$open_match" ]]; then
                  match_repo=$(jq -r '.repository.nameWithOwner' <<<"$open_match")
                  match_number=$(jq -r '.number' <<<"$open_match")
                  match_url=$(jq -r '.url' <<<"$open_match")
                  if [[ "$match_repo" == "$GITHUB_REPOSITORY" ]]; then
                    target=$match_number
                  else
                    note "Signature ${sig} is already tracked in ${match_url}. No issue opened."
                    record "$sig" "$match_url" "$match_repo" "$match_number"
                    continue
                  fi
                elif [[ -n "$transferred_closed" ]]; then
                  skip_closed "$sig" "$(jq -r '.url' <<<"$transferred_closed")" "$(jq -r '.repository.nameWithOwner' <<<"$transferred_closed")" "$(jq -r '.number' <<<"$transferred_closed")"
                  continue
                fi
              fi
            fi

            if [[ -n "$target" ]]; then
              gh issue comment "$target" -R "$GITHUB_REPOSITORY" --body "$recurrence"
              url=$(gh issue view "$target" -R "$GITHUB_REPOSITORY" --json url --jq '.url')
              record "$sig" "$url" "$GITHUB_REPOSITORY" "$target"
              note "Signature ${sig} recurred. Commented on ${url}."
              continue
            fi

            first_command=$(head -n 1 <<<"$commands")
            cmd_file=$(grep -Eo 'tests/[^[:space:]]+\.py' <<<"$first_command" | head -n 1 || true)
            pytest_re='^(FAILED|ERROR) ([^ ]+)( - (.*))?$'
            if [[ "$error_line" =~ $pytest_re ]]; then
              test_id=${BASH_REMATCH[2]}
              test_path=${test_id%%::*}
              subject="${test_path##*/}${test_id#"$test_path"}"
              short=${BASH_REMATCH[4]:-${BASH_REMATCH[1],,}}
            elif [[ -n "$cmd_file" ]]; then
              subject=${cmd_file##*/}
              short=$error_line
            else
              subject=$first_command
              short=$error_line
            fi
            if (( ${#short} > 100 )); then
              short="${short:0:97}..."
            fi
            prefix="Juju integration tests failed on ${GITHUB_REPOSITORY#*/} (Juju ${JUJU_CHANNEL}): "
            suffix=" [${sig}]"
            middle="${subject} - ${short}"
            room=$(( 250 - ${#prefix} - ${#suffix} ))
            if (( ${#middle} > room )); then
              middle="${middle:0:room-3}..."
            fi
            title="${prefix}${middle}${suffix}"
            {
              printf '%s\n\n' "$marker"
              printf 'Failure signature: %s\n\n' "$sig"
              printf 'Run: %s\nRef: %s\nCommit: %s\nJuju channel: %s\n\n' "$RUN_URL" "$SOURCE_REF" "$SOURCE_SHA" "$JUJU_CHANNEL"
              printf 'Error:\n\n~~~~text\n%s\n~~~~\n\n' "$error_line"
              printf 'Failed commands:\n%s\n\n' "$command_list"
              printf '## Failure summary\n'
              cat "$group/excerpt.md"
              printf '\nFull Juju debug logs, status, and pod events are in the run artifacts. Later runs that fail with the same error comment here instead of opening a new issue, including after this issue is transferred.\n'
            } > "$group/body.md"

            create_args=(-R "$GITHUB_REPOSITORY" --title "$title" --body-file "$group/body.md")
            IFS=',' read -ra labels <<<"$ISSUE_LABELS"
            for label in "${labels[@]}"; do
              label=$(xargs <<<"$label")
              if [[ -n "$label" ]]; then
                create_args+=(--label "$label")
              fi
            done
            url=$(gh issue create "${create_args[@]}" | tail -n 1)
            record "$sig" "$url" "$GITHUB_REPOSITORY" "${url##*/}"
            note "Signature ${sig} is new. Opened ${url}."
          done

      - name: Save issue ledger
        if: ${{ always() && steps.ledger.outputs.ok == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ledger.outputs.name }}
          path: ledger.json
          retention-days: 90
