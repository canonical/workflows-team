## this file contains the workflow CI runner for SBOM and secscan

name: SSDLC scanning

on:
    workflow_dispatch:
      inputs:
        product:
          description: "Product to scan (use 'all' for both)"
          type: choice
          options:
            - all
            - temporal
            - airflow
          default: all
    schedule:
      - cron: "0 0 15 3,9 *"
#              │ │ │  │    │
#              │ │ │  │    └─ any day of the week.
#              │ │ │  └────── 3rd and 9th month (March & September).
#              │ │ └───────── 15th day of the month.
#              │ └─────────── 0th hour of the day.
#              └───────────── Start of the hour (minutes = 0).
jobs:
    scan:
        runs-on: [self-hosted, self-hosted-linux-amd64-jammy-private-endpoint-medium]
        strategy:
          fail-fast: false
          matrix:
            product: ${{ (github.event_name == 'schedule' || inputs.product == 'all') && fromJSON('["temporal", "airflow"]') || fromJSON(format('["{0}"]', inputs.product)) }}

        name: SSDLC scanning - all clients - ${{ matrix.product }} artifacts
        steps:
          - name: Checkout
            uses: actions/checkout@v4
          - name: Run sbomber action
            uses: canonical/sbomber/.github/actions/run@main
            with:
              manifest: "${{ github.workspace }}/sbom_secscan_manifest_${{ matrix.product }}.yaml"
              artifact-name: ${{ matrix.product }}
          - name: Notify team on scheduled failure
            if: failure() && github.event_name == 'schedule'
            uses: mattermost/action-mattermost-notify@master
            with:
              MATTERMOST_WEBHOOK_URL: $${{ secrets.MATTERMOST_WEBHOOK_URL }}
              TEXT: SSDLC scheduled scan failed for `${{ matrix.product }}` in [$${{ github.repository }}]($${{ github.server_url }}/$${{ github.repository }}/actions/runs/$${{ github.run_id }})
