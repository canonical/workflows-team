apiVersion: v1
kind: Namespace
metadata:
  name: ${GITEA_NAMESPACE}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: ${GITEA_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitea
  template:
    metadata:
      labels:
        app: gitea
    spec:
      containers:
        - name: gitea
          image: ${GITEA_IMAGE}
          ports:
            - name: http
              containerPort: 3000
            - name: ssh
              containerPort: 22

          env:
            - name: USER_UID
              value: "1000"
            - name: USER_GID
              value: "1000"
            - name: INSTALL_LOCK
              value: "true"
            - name: GITEA__database__DB_TYPE
              value: "sqlite3"
            - name: GITEA__database__PATH
              value: "/data/gitea/gitea.db"
            - name: GITEA__server__ROOT_URL
              value: "http://gitea.${GITEA_NAMESPACE}.svc.cluster.local:3000/"

          volumeMounts:
            - name: gitea-data
              mountPath: /data

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: gitea-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: ${GITEA_NAMESPACE}
spec:
  selector:
    app: gitea
  ports:
    - name: http
      port: 3000
      targetPort: http
    - name: ssh
      port: 22
      targetPort: ssh
