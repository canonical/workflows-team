# run secscan using the sbomber tool on all temporal charms and rocks
# this manifest is used in `.github/workflows/sbom_secscan.yaml`
#
# Every artifact defines `type`, `channel` and `base`. Rocks are pulled from the
# OCI resource of a charm at that channel, so we scan the image actually shipped.
#
# `ssdlc_params` are the SEC0025 identification parameters; with them, results
# go to the long-term SSDLC scan registry. `version` is the product track and
# `cycle` defaults to the upcoming Ubuntu release (the cycle being scanned).

clients:
  sbom:
    department: charm_engineering
    email: workflows-charmers@canonical.com
    team: analytics
  secscan: {}

artifacts:
  # charms
  - name: temporal-k8s
    type: charm
    channel: 1.31/stable
    base: ubuntu@26.04
    ssdlc_params:
      name: Charmed Temporal
      version: "1.31"
      channel: stable

  - name: temporal-ui-k8s
    type: charm
    channel: 1.31/stable
    base: ubuntu@26.04
    ssdlc_params:
      name: Charmed Temporal
      version: "1.31"
      channel: stable

  # the worker charm has its own track, independent of the server version
  - name: temporal-worker-k8s
    type: charm
    channel: 2.0/stable
    base: ubuntu@24.04
    ssdlc_params:
      name: Charmed Temporal
      version: "2.0"
      channel: stable

  - name: temporal-admin-k8s
    type: charm
    channel: 1.31/stable
    base: ubuntu@26.04
    ssdlc_params:
      name: Charmed Temporal
      version: "1.31"
      channel: stable

  # rocks
  # ubuntu/temporal-server; also used by temporal-admin-k8s
  - name: temporal-server-rock
    type: rock
    charm: temporal-k8s
    charm_resource: temporal-server-image
    channel: 1.31/stable
    base: ubuntu@26.04
    ssdlc_params:
      name: Charmed Temporal
      version: "1.31"
      channel: stable

  - name: temporal-ui-rock
    type: rock
    charm: temporal-ui-k8s
    charm_resource: temporal-ui-image
    channel: 1.31/stable
    base: ubuntu@26.04
    ssdlc_params:
      name: Charmed Temporal
      version: "1.31"
      channel: stable
